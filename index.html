<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKIYA REALM 2026 | THE DRAGON DOMAIN</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000;
            --secondary: #1a1a1a;
            --accent: #8b0000;
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: black;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* --- SPIDER WEB BACKGROUND --- */
        #web-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.4;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        /* --- DRAGON MASK SECTION --- */
        .dragon-rite {
            padding: 50px;
            text-align: center;
            background: linear-gradient(to bottom, transparent, var(--secondary));
        }

        #camera-feed {
            width: 100%;
            max-width: 500px;
            border: 3px solid var(--primary);
            border-radius: 15px;
            box-shadow: 0 0 20px var(--primary);
            margin-bottom: 20px;
        }

        .btn-dragon {
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .btn-dragon:hover {
            letter-spacing: 3px;
            background: white;
            color: black;
        }

        /* --- LIVE GUARDIANS GALLERY --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .guardian-card {
            border: 1px solid var(--primary);
            padding: 5px;
            background: #000;
            transition: transform 0.3s;
        }

        .guardian-card:hover { transform: scale(1.05); }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            border-top: 1px solid #333;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <canvas id="web-canvas"></canvas>

    <nav>
        <div class="logo">AKIYA REALM 2026</div>
        <div id="live-visitors">LIVE: 1</div>
        <div class="user-profile" id="user-display">
            <button class="btn-dragon" onclick="login()">LOGIN WITH GOOGLE</button>
        </div>
    </nav>

    <section class="dragon-rite">
        <h2 style="font-family: 'Orbitron';">THE DRAGON RITE</h2>
        <p>Become a Guardian of the Realm. Access your camera to receive the mask.</p>
        
        <video id="camera-feed" autoplay playsinline></video>
        <canvas id="mask-overlay" style="display:none;"></canvas>
        <br>
        <button class="btn-dragon" onclick="captureGuardian()">CAPTURE & JOIN</button>
    </section>

    <section id="gallery-section">
        <h3 style="text-align:center; font-family: 'Orbitron';">LIVE GUARDIANS</h3>
        <div class="gallery-grid" id="guardian-gallery">
            <!-- Photos will appear here -->
        </div>
    </section>

    <footer>
        POWERED BY AKIYA | ALL RIGHTS RESERVED 2026
    </footer>

    <!-- Firebase & Custom Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Config (Replace with your actual Firebase config)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            authDomain: "YOUR_AUTH_DOMAIN"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // 1. Google Login
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(result => {
                const user = result.user;
                document.getElementById('user-display').innerHTML = `<img src="${user.photoURL}" title="${user.displayName}">`;
                if(user.email === 'kaviakiya@gmail.com') {
                    alert("Welcome Founder Akiya!");
                }
            });
        }

        // 2. Camera Access
        const video = document.getElementById('camera-feed');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => video.srcObject = stream)
            .catch(err => console.error("Camera access denied", err));

        // 3. Capture & Save Guardian
        function captureGuardian() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // Simulating a Dragon Mask Overlay
            ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
            ctx.font = "30px Orbitron";
            ctx.fillText("GUARDIAN", 50, 50);

            const dataUrl = canvas.toDataURL('image/png');
            const newGuardianRef = db.ref('guardians').push();
            newGuardianRef.set({
                image: dataUrl,
                timestamp: Date.now()
            });
        }

        // 4. Live Visitor Counter
        db.ref('presence').on('value', snap => {
            document.getElementById('live-visitors').innerText = `LIVE: ${snap.numChildren() || 1}`;
        });

        // 5. Real-time Gallery Update
        db.ref('guardians').limitToLast(10).on('value', snap => {
            const gallery = document.getElementById('guardian-gallery');
            gallery.innerHTML = '';
            snap.forEach(child => {
                const img = child.val().image;
                gallery.innerHTML += `<div class="guardian-card"><img src="${img}" width="100%"></div>`;
            });
        });

        // --- SPIDER WEB EFFECT ---
        const canvas = document.getElementById('web-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // (Spider web logic would go here - simplified for length)
        function drawWeb() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 0.5;
            // Simple grid/lines for effect
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(canvas.width-i, canvas.height); ctx.stroke();
            }
        }
        setInterval(drawWeb, 100);

    </script>
</body>
</html>
