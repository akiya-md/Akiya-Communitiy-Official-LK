<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKIYA REALM 2026 | THE DRAGON </title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000;
            --secondary: #1a1a1a;
            --accent: #8b0000;
            --text: #ffffff;
        }

        body {
            margin: 0;
            background: black;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* --- SPIDER WEB BACKGROUND --- */
        #web-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.4;
        }

        /* --- NAVBAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        /* --- DRAGON MASK SECTION --- */
        .dragon-rite {
            padding: 50px;
            text-align: center;
            background: linear-gradient(to bottom, transparent, var(--secondary));
        }

        #camera-feed {
            width: 100%;
            max-width: 500px;
            border: 3px solid var(--primary);
            border-radius: 15px;
            box-shadow: 0 0 20px var(--primary);
            margin-bottom: 20px;
        }

        .btn-dragon {
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .btn-dragon:hover {
            letter-spacing: 3px;
            background: white;
            color: black;
        }

        /* --- LIVE GUARDIANS GALLERY --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .guardian-card {
            border: 1px solid var(--primary);
            padding: 5px;
            background: #000;
            transition: transform 0.3s;
        }

        .guardian-card:hover { transform: scale(1.05); }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            border-top: 1px solid #333;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <canvas id="web-canvas"></canvas>

    <nav>
        <div class="logo">AKIYA REALM 2026</div>
        <div id="live-visitors">LIVE: 1</div>
        <div class="user-profile" id="user-display">
            <button class="btn-dragon" onclick="login()">LOGIN WITH GOOGLE</button>
        </div>
    </nav>

    <section class="dragon-rite">
        <h2 style="font-family: 'Orbitron';">THE DRAGON RITE</h2>
        <p>Become a Guardian of the Realm. Access your camera to receive the mask.</p>
        
        <video id="camera-feed" autoplay playsinline></video>
        <canvas id="mask-overlay" style="display:none;"></canvas>
        <br>
        <button class="btn-dragon" onclick="captureGuardian()">CAPTURE & JOIN</button>
    </section>

    <section id="gallery-section">
        <h3 style="text-align:center; font-family: 'Orbitron';">LIVE GUARDIANS</h3>
        <div class="gallery-grid" id="guardian-gallery">
            <!-- Photos will appear here -->
        </div>
    </section>

    <footer>
        POWERED BY AKIYA | ALL RIGHTS RESERVED 2026
    </footer>

    <!-- Firebase SDKs (v9 Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        // පින්තූරවල තිබුණු උඹේම Original Config එක
        const firebaseConfig = {
            apiKey: "AIzaSyDEmPDHu3jybcYu-nKl5cCHyyWNnerex-w",
            authDomain: "akiya-communitiy-official-lk.firebaseapp.com",
            databaseURL: "https://akiya-communitiy-official-lk-default-rtdb.firebaseio.com",
            projectId: "akiya-communitiy-official-lk",
            storageBucket: "akiya-communitiy-official-lk.firebasestorage.app",
            messagingSenderId: "180586817754",
            appId: "1:180586817754:web:c505feb010c7c67c15dde3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // 1. Google Login (Fixed Function)
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            // මේකෙන් තමයි Google Popup එක එන්නේ
            auth.signInWithPopup(provider)
                .then(result => {
                    const user = result.user;
                    console.log("Logged in as:", user.displayName);
                    document.getElementById('user-display').innerHTML = `<img src="${user.photoURL}" title="${user.displayName}">`;
                    
                    if(user.email === 'kaviakiya@gmail.com') {
                        alert("Welcome Founder Akiya! Access Granted.");
                    }
                })
                .catch(error => {
                    console.error("Login Error:", error.message);
                    alert("අවුලක් වුණා බොක්ක: " + error.message);
                });
        }

        // 2. Camera Access
        const video = document.getElementById('camera-feed');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => video.srcObject = stream)
                .catch(err => console.error("Camera access denied", err));
        }

        // 3. Capture & Save Guardian
        function captureGuardian() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            ctx.fillStyle = "rgba(255, 0, 0, 0.4)";
            ctx.font = "bold 30px Orbitron";
            ctx.fillText("AKIYA GUARDIAN", 20, 50);

            const dataUrl = canvas.toDataURL('image/png');
            db.ref('guardians').push({
                image: dataUrl,
                timestamp: Date.now()
            });
        }

        // 4. Live Visitor Counter
        db.ref('presence').on('value', snap => {
            document.getElementById('live-visitors').innerText = `LIVE: ${snap.numChildren() || 1}`;
        });

        // 5. Real-time Gallery Update
        db.ref('guardians').limitToLast(10).on('value', snap => {
            const gallery = document.getElementById('guardian-gallery');
            gallery.innerHTML = '';
            snap.forEach(child => {
                const img = child.val().image;
                gallery.innerHTML += `<div class="guardian-card"><img src="${img}" width="100%"></div>`;
            });
        });

        // --- SPIDER WEB EFFECT ---
        const webCanvas = document.getElementById('web-canvas');
        const webCtx = webCanvas.getContext('2d');
        webCanvas.width = window.innerWidth;
        webCanvas.height = window.innerHeight;

        function drawWeb() {
            webCtx.clearRect(0,0, webCanvas.width, webCanvas.height);
            webCtx.strokeStyle = '#ff0000';
            webCtx.lineWidth = 0.5;
            for(let i=0; i<webCanvas.width; i+=60) {
                webCtx.beginPath(); webCtx.moveTo(i,0); webCtx.lineTo(webCanvas.width-i, webCanvas.height); webCtx.stroke();
            }
        }
        setInterval(drawWeb, 150);

        window.addEventListener('resize', () => {
            webCanvas.width = window.innerWidth;
            webCanvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
