<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKIYA REALM 2026 | THE MASTER CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000;
            --gold: #ffd700;
            --bg: #030303;
            --panel: rgba(15, 15, 15, 0.98);
            --border: rgba(255, 0, 0, 0.3);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- TOP NAVIGATION BAR --- */
        nav {
            background: #000; border-bottom: 2px solid var(--primary);
            padding: 10px 30px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 0 15px rgba(255,0,0,0.3); z-index: 100;
        }

        .logo { font-family: 'Orbitron'; font-weight: 900; color: var(--primary); font-size: 1.5rem; }
        
        /* USER PROFILE SECTION */
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .profile-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); overflow: hidden; }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        .login-status { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--gold); }

        /* --- MAIN DASHBOARD LAYOUT --- */
        .dashboard {
            display: grid; grid-template-columns: 320px 1fr 380px; flex: 1; overflow: hidden;
        }

        .sidebar { background: var(--panel); border: 1px solid var(--border); margin: 15px; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
        .header-tag { font-family: 'Orbitron'; font-size: 0.8rem; padding: 15px; border-bottom: 1px solid var(--border); color: var(--primary); text-align: center; background: rgba(255,0,0,0.05); }

        /* 1. UNLIMITED LINK SYSTEM (Adjusted Width) */
        .link-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .link-card { background: rgba(20,20,20,1); border: 1px solid #333; padding: 15px; margin-bottom: 12px; border-radius: 12px; transition: 0.3s; }
        .link-card:hover { border-color: var(--gold); transform: scale(1.02); }

        /* 2. CENTER STAGE (POSTER & CONTEST) - Balanced Spacing */
        .main-stage { overflow-y: auto; padding: 15px 30px; scrollbar-width: none; }
        .poster-wrap { position: relative; border-radius: 20px; overflow: hidden; border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .poster-wrap img { width: 100%; display: block; }
        
        .contest-section { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 20px; margin: 25px 0; align-items: end; }
        .rank-box { background: #0a0a0a; border: 1px solid #222; padding: 20px; border-radius: 15px; text-align: center; }
        .rank-box.gold { border: 2px solid var(--gold); background: linear-gradient(180deg, #1a1a00, #000); transform: scale(1.08); }

        /* 3. MULTIMEDIA CHAT */
        .chat-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #050505; }
        .chat-input { padding: 15px; background: #0a0a0a; border-top: 1px solid var(--border); }

        /* BUTTONS */
        .btn-akiya { background: var(--primary); color: white; border: none; padding: 12px; font-family: 'Orbitron'; cursor: pointer; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-akiya:hover { background: var(--gold); color: black; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AKIYA REALM</div>
        <div class="user-profile" id="user-info">
            <div class="login-status" id="status-text">GUEST_009</div>
            <div class="profile-img" id="profile-pic">
                <img src="https://via.placeholder.com/40/111/ff0000?text=A" alt="Profile">
            </div>
            <button class="btn-akiya" style="width:auto; padding:5px 15px; font-size:10px;" onclick="handleLogin()">LOGIN</button>
        </div>
    </nav>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="header-tag">UNLIMITED LINK SYSTEM</div>
            <div class="link-scroll" id="link-list">
                <div class="link-card">
                    <strong style="color:var(--gold);">DRAGON MOD v4</strong>
                    <p style="font-size:11px; opacity:0.7; margin-top:5px;">New encrypted link for realm access.</p>
                </div>
            </div>
            <div style="padding:15px;"><button class="btn-akiya">POST LINK</button></div>
        </aside>

        <main class="main-stage">
            <div class="poster-wrap">
                <img src="https://via.placeholder.com/1920x1080/1a0000/ff0000?text=NEW+SYSTEM+UPDATE" id="main-poster">
                <div style="position:absolute; bottom:10px; right:20px; font-size:10px; opacity:0.6;">RES: 1920x1080</div>
            </div>

            <div class="contest-section">
                <div class="rank-box">🥈 RANK 2</div>
                <div class="rank-box gold">👑 RANK 1<br><small>GOLDEN CARD</small></div>
                <div class="rank-box">🥉 RANK 3</div>
            </div>

            <center>
                <video id="guardian-eye" autoplay playsinline muted style="width:100%; max-width:480px; border-radius:20px; border:1px solid var(--primary);"></video>
                <p style="font-family:'Orbitron'; font-size:12px; color:var(--primary); margin-top:10px;">GUARDIAN EYE: ONLINE (24/7)</p>
                <button class="btn-akiya" style="max-width:300px;">CAPTURE & ENTER CONTEST</button>
            </center>
        </main>

        <aside class="sidebar">
            <div class="header-tag">GLOBAL MULTIMEDIA CHAT</div>
            <div class="chat-view" id="chat-messages">
                <div style="background:#111; padding:10px; border-radius:10px; border-left:3px solid var(--primary);">
                    <small style="color:var(--gold);">System:</small><br>Welcome Akiya. The Dragon Awakens.
                </div>
            </div>
            <div class="chat-input">
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <button class="btn-akiya" style="width:45px;">🎤</button>
                    <button class="btn-akiya" style="width:45px;">📷</button>
                    <input type="text" placeholder="Type message..." style="flex:1; background:#1a1a1a; border:1px solid #333; color:white; padding:10px; border-radius:10px;">
                </div>
                <button class="btn-akiya">SEND MESSAGE</button>
            </div>
        </aside>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <script>
        // LOGIN LOGIC (Persistent for 30 Days)
        function handleLogin() {
            // Firebase Google Provider Logic Here
            alert("Redirecting to Google Login...");
        }

        // CAMERA FEED
        const video = document.getElementById('guardian-eye');
        if (navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
            });
        }
    </script>
</body>
</html>
